[workspace]
resolver = "2"
members = ["crates/core", "crates/ffi", "crates/cli"]
exclude = ["vendor/keepassxcr"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/simplenty/keepassity"

# Lints are declared per crate (core forbids unsafe; ffi must allow `no_mangle`).

# hidapi (transitive: keepassxcr -> YubiKey support) fails to build with MSVC
# `/Z7` in debug mode (C compiler D8050: debug record too long). We do not use
# YubiKey support; disabling debug info for this C dependency keeps `cargo test`
# working without changing the global debug profile.
[profile.dev.package.hidapi]
debug = false

# Argon2id is memory-hard on purpose; keeping it unoptimised would make every
# test that creates or opens a database take seconds in debug builds (CI runs
# `cargo test` in debug). Optimise only the hashing crate and the vendored format
# crate that drives it, so debug builds stay usable without touching profile
# defaults (mirrors the hidapi override above).
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.keepassxcr]
opt-level = 2

[profile.test.package.argon2]
opt-level = 3

[profile.test.package.keepassxcr]
opt-level = 2

[profile.bench.package.argon2]
opt-level = 3