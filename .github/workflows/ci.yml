name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: verify fixture manifest
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./scripts/verify-fixtures.ps1
      - name: Linux build deps (hidapi/udev)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  interop:
    name: interop / ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: install keepassxc and build deps
        run: sudo apt-get update && sudo apt-get install -y keepassxc libudev-dev pkg-config
      - name: fixture round trip + keepassxc verification
        shell: pwsh
        run: ./tools/interop/verify.ps1 -FixturesOnly -KeepassXcPath keepassxc-cli

  # Second independent reader: KeePassLib (official C# library) on Windows.
  # The official KeePass 2.6x binaries are NativeAOT and do not ship a managed
  # KeePassLib.dll, so the library is built from the pinned official source
  # release and then used by tools/interop/verify.ps1 to re-open every fixture
  # and its rewritten copy (same canonical structural hash required).
  interop-keepasslib:
    name: interop-keepasslib / windows
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # Pinned official release: KeePass-2.59-Source.zip, published on
      # https://keepass.info/download.html and hashed on
      # https://keepass.info/integrity.html (SHA-256 below, verified in the
      # download step; a mismatch fails the job loudly).
      KEEPASS_VERSION: "2.59"
      KEEPASS_SOURCE_SHA256: "7AC2711821836FC0198B6F19ECD787318C8BF06585A4A3AEB2E6BD5319604A7B"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - name: download and verify the official KeePass source release
        shell: pwsh
        # SourceForge is the only official distributor and it answers differently
        # depending on client, cookies and mirror state. Try the concrete mirror
        # endpoints first with a browser User-Agent, then fall back to parsing the
        # download page for a mirror link. The hash is the authority either way:
        # the first candidate with the pinned SHA-256 wins and a mismatch fails
        # the job loudly instead of silently skipping interop.
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:KEEPASS_VERSION
          $archive = Join-Path $env:RUNNER_TEMP "KeePass-$version-Source.zip"
          $sourceRoot = Join-Path $env:RUNNER_TEMP 'keepass-source'
          $expected = $env:KEEPASS_SOURCE_SHA256
          $ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'
          $encoded = 'KeePass%20' + $version
          $candidates = @(
            "https://sourceforge.net/projects/keepass/files/$encoded/KeePass-$version-Source.zip/download",
            "https://master.dl.sourceforge.net/project/keepass/$encoded/KeePass-$version-Source.zip?viasf=1",
            "https://downloads.sourceforge.net/project/keepass/$encoded/KeePass-$version-Source.zip",
            "https://downloads.sourceforge.net/project/keepass/$encoded/KeePass-$version-Source.zip?use_mirror=autoselect"
          )
          function Test-ZipArchive([string]$path) {
            if (-not (Test-Path -LiteralPath $path)) { return $false }
            $stream = [System.IO.File]::OpenRead($path)
            try {
              return ($stream.ReadByte() -eq 0x50 -and $stream.ReadByte() -eq 0x4B)
            }
            finally { $stream.Dispose() }
          }
          function Test-ExpectedHash([string]$path) {
            if (-not (Test-ZipArchive $path)) { return $false }
            return ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -eq $expected)
          }
          $ok = $false
          foreach ($url in $candidates) {
            if (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive -Force }
            Write-Host "trying $url"
            & curl.exe --silent --show-error --location --fail --retry 2 --retry-delay 3 --max-time 300 `
              --user-agent $ua --output $archive $url
            if ($LASTEXITCODE -ne 0) { Write-Host "  curl exit $LASTEXITCODE"; continue }
            if (Test-ExpectedHash $archive) {
              Write-Host "  downloaded from this endpoint"
              $ok = $true
              break
            }
            Write-Host "  endpoint answered with $(if (Test-Path -LiteralPath $archive) { (Get-Item $archive).Length } else { 0 }) bytes that are not the pinned archive"
          }
          if (-not $ok) {
            # Last resort: fetch the download page and follow any keepass zip link
            # it advertises (the page embeds a short-lived mirror URL).
            $pageUrl = $candidates[0]
            Write-Host "parsing $pageUrl for a mirror link"
            $html = & curl.exe --silent --show-error --location --fail --max-time 120 --user-agent $ua $pageUrl
            if ($LASTEXITCODE -ne 0) { throw "could not fetch the SourceForge download page (curl exit $LASTEXITCODE)" }
            $match = [regex]::Match(($html -join "`n"), 'https://[^"''<> ]*sourceforge\.net[^"''<> ]*KeePass-[^"''<> ]*\.zip[^"''<> ]*')
            if (-not $match.Success) { throw 'no official KeePass source archive could be downloaded or found on the download page (SourceForge layout changed?)' }
            $mirror = $match.Value -replace '&amp;', '&'
            Write-Host "trying mirror $mirror"
            & curl.exe --silent --show-error --location --fail --retry 2 --retry-delay 3 --max-time 300 `
              --user-agent $ua --output $archive $mirror
            if ($LASTEXITCODE -ne 0) { throw "mirror download failed (curl exit $LASTEXITCODE)" }
            if (-not (Test-ExpectedHash $archive)) {
              $actual = if (Test-Path -LiteralPath $archive) { (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash } else { '<missing>' }
              throw "KeePass source SHA-256 mismatch: $actual (expected $expected)"
            }
            $ok = $true
          }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          Write-Host "KeePass $version source verified: $hash"
          Expand-Archive -LiteralPath $archive -DestinationPath $sourceRoot -Force
      - name: build managed KeePassLib from source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere.exe not found' }
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found' }
          $sourceRoot = Join-Path $env:RUNNER_TEMP 'keepass-source'
          $project = Get-ChildItem -LiteralPath $sourceRoot -Recurse -Filter 'KeePassLib_N48.csproj' | Select-Object -First 1
          if (-not $project) { throw 'KeePassLib_N48.csproj not found in the KeePass source release' }
          # The source release ships dummy strong-name key files; we only need a
          # working test library, so build it unsigned.
          & $msbuild $project.FullName /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /p:SignAssembly=false /nologo /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "KeePassLib build failed (exit $LASTEXITCODE)" }
          $dll = Get-ChildItem -LiteralPath $sourceRoot -Recurse -Filter 'KeePassLib.dll' |
            Where-Object { $_.FullName -match '\\Release\\' } | Select-Object -First 1
          if (-not $dll) { throw 'built KeePassLib.dll not found' }
          Write-Host "KeePassLib: $($dll.FullName) ($($dll.Length) bytes)"
          Add-Content -Path $env:GITHUB_ENV -Value "KEEPASS_LIB_DLL=$($dll.FullName)"
      - name: build keepassity-cli
        run: cargo build -p keepassity-cli
      - name: fixture round trip + KeePassLib verification
        shell: pwsh
        run: ./tools/interop/verify.ps1 -FixturesOnly -KeePassLibDll $env:KEEPASS_LIB_DLL

  sync-matrix:
    name: sync-matrix / ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Linux build deps (hidapi/udev)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: 18-scenario sync matrix
        run: cargo test -p keepassity-core --test sync_matrix

  ffi:
    name: ffi / ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - name: Linux build deps (hidapi/udev)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: build FFI library
        run: cargo build -p keepassity-ffi --release
      - name: C harness (all commands)
        run: |
          gcc crates/ffi/tests/kp_smoke.c -Icrates/ffi/include \
            target/release/libkeepassity_ffi.a -o /tmp/kp_smoke -lpthread -ldl -lm
          /tmp/kp_smoke tests/fixtures/keepass-rs/test_db_kdbx4_with_password_aes.kdbx demopass
      - name: C# P/Invoke smoke (open/list/totp/save)
        env:
          KEEPASSITY_FFI_FIXTURE: ${{ github.workspace }}/tests/fixtures/keepass-rs/test_db_kdbx4_with_password_aes.kdbx
          KEEPASSITY_FFI_PASSWORD: demopass
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: dotnet run --project tests/ffi-csharp -c Release

  app:
    name: app / windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - name: build FFI library
        run: cargo build -p keepassity-ffi --release
      - name: restore and build the app
        run: >-
          dotnet build apps/windows/Keepassity.sln -c Release
          /p:KeepassityFfiDir=${{ github.workspace }}\target\release\
      - name: core service tests
        run: dotnet run --project tests/app-core/Keepassity.Core.Tests -c Release
      - name: application self-test
        shell: pwsh
        run: |
          $cases = @(
            @{ fixture = 'tests/fixtures/keepass-rs/test_db_kdbx4_with_password_aes.kdbx'; password = 'demopass' },
            @{ fixture = 'tests/fixtures/keepass-rs/test_db_kdbx4_with_totp_entry.kdbx'; password = 'test' }
          )
          $exe = (Get-ChildItem 'apps/windows/Keepassity.Mock/bin' -Recurse -Filter 'Keepassity.exe' |
            Where-Object { $_.FullName -match '\\Release\\' } | Select-Object -First 1).FullName
          foreach ($case in $cases) {
            $report = Join-Path $env:RUNNER_TEMP ('selftest-' + [guid]::NewGuid().ToString('N') + '.log')
            $env:KEEPASSITY_SELFTEST_PASSWORD = $case.password
            $env:KEEPASSITY_SELFTEST_REPORT = $report
            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = $exe
            $psi.Arguments = '--selftest "' + (Resolve-Path $case.fixture).Path + '"'
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $process = [System.Diagnostics.Process]::Start($psi)
            if (-not $process.WaitForExit(120000)) { $process.Kill(); throw "selftest timeout: $($case.fixture)" }
            $content = if (Test-Path $report) { Get-Content $report -Raw } else { '' }
            Write-Host $content
            if ($content -notmatch '(?m)^PASS\s*$') { throw "selftest failed: $($case.fixture)" }
          }
      - name: dependency audit (informational)
        shell: pwsh
        continue-on-error: true
        run: dotnet list apps/windows/Keepassity.Mock/Keepassity.Mock.csproj package --vulnerable --include-transitive

  ui-strings:
    name: ui-strings / ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: reject hard-coded CJK text in the English UI
        shell: pwsh
        run: ./tools/check-ui-strings.ps1

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: taiki-e/install-action@98b24ef8830c90613ec3b57343df3abde2b66e56 # cargo-deny branch
      - name: cargo deny
        run: cargo deny check

  public-hygiene:
    name: public-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: enforce public allowlist
        shell: pwsh
        run: ./scripts/check-public.ps1
