name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux build deps (hidapi/udev)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  interop:
    name: interop / ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: install keepassxc and build deps
        run: sudo apt-get update && sudo apt-get install -y keepassxc libudev-dev pkg-config
      - name: fixture round trip + keepassxc verification
        shell: pwsh
        run: ./tools/interop/verify.ps1 -FixturesOnly -KeepassXcPath keepassxc-cli

  sync-matrix:
    name: sync-matrix / ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Linux build deps (hidapi/udev)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: 18-scenario sync matrix
        run: cargo test -p keepassity-core --test sync_matrix

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-deny
      - name: cargo deny
        run: cargo deny check

  public-hygiene:
    name: public-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: enforce public allowlist
        shell: pwsh
        run: ./scripts/check-public.ps1
