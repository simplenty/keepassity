name: codeql

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "31 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze-csharp:
    name: codeql / csharp
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - name: initialize CodeQL
        uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          languages: csharp
          # Security-only suite; quality findings (P/Invoke, catch-all handlers,
          # Path.Combine with fixed paths) were reviewed manually and are not
          # vulnerabilities. Generated files are excluded in the config file.
          queries: security-extended
          config-file: .github/codeql/codeql-config.yml
      - name: restore and build
        run: dotnet build apps/windows/Keepassity.sln -c Release
      - name: analyze
        uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          category: "/language:csharp"
