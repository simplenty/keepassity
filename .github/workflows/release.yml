name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    name: build / windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "8.0.x"

      - name: determine version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'empty version tag' }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "KEEPASSITY_VERSION=$version`n")

      - name: verify the source
        shell: pwsh
        run: |
          cargo test --workspace
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet run --project tests/app-core/Keepassity.Core.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-fixtures.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: build FFI library
        run: cargo build -p keepassity-ffi --release

      - name: publish portable package
        shell: pwsh
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/publish-windows.ps1
          -Version $env:KEEPASSITY_VERSION
          -OutputRoot out/dist
          -FfiDir "${{ github.workspace }}\target\release"
          -Zip

      - name: self-test the published application
        shell: pwsh
        run: |
          $exe = (Resolve-Path "out/dist/keepassity-$env:KEEPASSITY_VERSION-win-x64/Keepassity.exe").Path
          $cases = @(
            @{ fixture = 'tests/fixtures/keepass-rs/test_db_kdbx4_with_password_aes.kdbx'; password = 'demopass' },
            @{ fixture = 'tests/fixtures/keepass-rs/test_db_kdbx4_with_totp_entry.kdbx'; password = 'test' }
          )
          foreach ($case in $cases) {
            $report = Join-Path $env:RUNNER_TEMP ('selftest-' + [guid]::NewGuid().ToString('N') + '.log')
            $env:KEEPASSITY_SELFTEST_PASSWORD = $case.password
            $env:KEEPASSITY_SELFTEST_REPORT = $report
            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = $exe
            $psi.Arguments = '--selftest "' + (Resolve-Path $case.fixture).Path + '"'
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $process = [System.Diagnostics.Process]::Start($psi)
            if (-not $process.WaitForExit(120000)) { $process.Kill(); throw "selftest timeout: $($case.fixture)" }
            $content = if (Test-Path $report) { Get-Content $report -Raw } else { '' }
            Write-Host $content
            if ($content -notmatch '(?m)^PASS\s*$') { throw "selftest failed: $($case.fixture)" }
          }

      - name: build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-installer.ps1 `
            -Version $env:KEEPASSITY_VERSION `
            -SourceDir "out/dist/keepassity-$env:KEEPASSITY_VERSION-win-x64" `
            -OutputDir "out/dist"

      - name: write checksums
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/make-checksums.ps1 -Directory out/dist

      - name: generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: out/dist
          format: spdx-json
          output-file: out/dist/sbom.spdx.json
          artifact-name: keepassity-sbom

      - name: attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "out/dist/*"

      - name: upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: keepassity-windows
          path: out/dist/*
          if-no-files-found: error

      - name: create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          generate_release_notes: true
          files: |
            out/dist/*.zip
            out/dist/*-setup.exe
            out/dist/SHA256SUMS
            out/dist/sbom.spdx.json
