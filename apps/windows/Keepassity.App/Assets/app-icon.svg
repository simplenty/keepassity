<?xml version="1.0" encoding="UTF-8"?>
<!--
  keepassity application icon — editable source.

  Keep this file in sync with tools/icon/make-app-icon.py: the Python script
  renders the same geometry to app.ico / app-icon-256.png / app-icon-512.png.
  Geometry is expressed in a 1024x1024 canvas; the shield is drawn at 4x and
  downsampled so the 16 px tray frame stays crisp.

  Palette: ink #0B1B2B -> teal #1FA6A0 diagonal gradient, white mark,
  ink keyhole.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1B2B"/>
      <stop offset="1" stop-color="#1FA6A0"/>
    </linearGradient>
  </defs>

  <!-- rounded tile, corner radius ~19.6% of the side -->
  <rect x="0" y="0" width="1024" height="1024" rx="201" ry="201" fill="url(#bg)"/>

  <!-- shield: rounded top block + tapered point -->
  <path fill="#F6FAFC"
        d="M354 196 H670 A86 86 0 0 1 756 282 V566 L512 856 L268 566 V282 A86 86 0 0 1 354 196 Z"/>

  <!-- keyhole: circle + tapered stem, ink -->
  <circle cx="512" cy="446" r="96" fill="#0B1B2B"/>
  <path fill="#0B1B2B"
        d="M460 486 H564 L608 690 H416 Z"/>
</svg>
