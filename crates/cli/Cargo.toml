# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "keepassity-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CLI harness for CI, interop and acceptance checks. Not shipped with the app."

[dependencies]
keepass = "0.17.0"
# KDBX write backend selected by ADR-0002; library-only build (no CLI/YubiKey UX).
keepassxcr = { path = "../../vendor/keepassxcr", default-features = false }
keepassity-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[lints.clippy]
all = "warn"
