# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "keepassity-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "C ABI + JSON bridge for the keepassity core."

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
keepassity-core = { path = "../core" }

[lints.rust]
# `#[no_mangle]` is required for the C ABI; this is the only crate allowed to use unsafe.
unsafe_code = "allow"

[lints.clippy]
all = "warn"